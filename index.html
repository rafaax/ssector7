<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SSECTOR7</title>
    <meta name="description" content="contracultura digital" />
    <meta name="theme-color" content="#07090c" />

    <!-- Os icones seguem o tema: o href do PNG e trocado por src/theme.js.
         Os valores daqui sao o padrao do tema escuro, que tambem e o que
         aparece quando o JS nao roda. -->
    <link rel="icon" href="/favicons/files/favicon.ico" sizes="16x16" />
    <link
      id="favicon-png"
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicons/files/favicon-dark-192.png"
    />
    <link id="favicon-apple" rel="apple-touch-icon" href="/favicons/files/favicon-dark-180.png" />
    <meta property="og:title" content="SSECTOR7" />
    <meta property="og:description" content="contracultura digital" />
  </head>
  <body>
    <div id="stage" class="stage"></div>

    <div id="loader" class="loader">
      <div class="loader__bar"><span id="loader-fill" class="loader__fill"></span></div>
      <p id="loader-label" class="loader__label">carregando</p>
    </div>

    <noscript class="fallback"><img src="/logo.png" alt="SSECTOR7" /></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
